version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      npm-minor-patch:
        update-types: ['minor', 'patch']
    ignore:
      # typescript-eslint, which eslint-config-next uses, doesn't support
      # TypeScript 7 yet
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
